```yaml
---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: julinho-os
description: Sistema Fedora imutável mínimo com XFCE
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - xfce4-session
        - xfce4-panel
        - xfce4-settings
        - xfdesktop
        - xfwm4
        - thunar
        - xfce4-terminal
        - lightdm
        - lightdm-gtk
        - dbus-x11

  - type: systemd
    system:
      enabled:
        - lightdm.service
```
