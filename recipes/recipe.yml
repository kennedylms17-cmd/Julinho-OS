---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: julinho-os
description: Sistema Fedora imutavel minimo com XFCE
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: latest

modules:
  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - xfce4-session
        - xfce4-panel
        - xfce4-settings
        - xfdesktop
        - xfwm4
        - thunar
        - xfce4-terminal
        - lightdm
        - lightdm-gtk
        - dbus-x11
        - xorg-x11-server-Xorg
        - xorg-x11-drv-libinput
        - mesa-dri-drivers
        - network-manager-applet
        - dejavu-sans-fonts

  - type: script
    snippets:
      - systemctl set-default graphical.target
      - useradd -m -G wheel kennedy
      - echo 'kennedy:123456' | chpasswd

  - type: systemd
    system:
      enabled:
        - lightdm.service
