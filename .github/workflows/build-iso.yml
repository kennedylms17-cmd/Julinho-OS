name: build-iso

on:
  workflow_dispatch:

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Build ISO
        id: build
        uses: jasonn3/build-container-installer@main
        with:
          arch: x86_64
          image_name: julinho-os
          image_repo: ghcr.io/kennedylms17-cmd
          image_tag: latest
          version: 44
          variant: Kinoite
          iso_name: julinho-os.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: julinho-os-iso
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
